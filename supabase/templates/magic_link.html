<!-- EMAIL COLOR EXCEPTION: email clients cannot resolve CSS variables, so this template uses LITERAL hex colors derived from the theme tokens. Literal hex is used here for that reason (one of a few sanctioned places). -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f5f8;margin:0;padding:32px 16px;">
  <tr>
    <td align="center" style="padding:0;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;width:100%;background-color:#ffffff;border:1px solid #e6e8ee;border-radius:10px;">
        <tr>
          <td style="padding:28px 32px 0 32px;">
            <img src="{{ .SiteURL }}/gains-logo.png" alt="GAINS" height="26" style="display:block;border:0;outline:none;text-decoration:none;" />
            <div style="height:3px;width:100%;margin-top:16px;border-radius:2px;background-color:#4f46e5;background-image:linear-gradient(90deg,#e8503a,#f59e0b,#facc15,#34c26b);"></div>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 32px 28px 32px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <h1 style="margin:0 0 12px 0;font-size:18px;font-weight:600;line-height:1.35;color:#1f2430;">Sign in to GAINS</h1>
            <p style="margin:0 0 22px 0;font-size:14px;line-height:1.65;color:#3d4353;">Use the button below to sign in to GAINS. The link expires shortly.</p>
            <a href="{{ .SiteURL }}/api/auth/confirm?token_hash={{ .TokenHash }}&type=magiclink&next=/app" style="display:inline-block;background-color:#4f46e5;color:#ffffff;text-decoration:none;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;font-weight:600;padding:11px 22px;border-radius:8px;">Sign in</a>
            <p style="margin:22px 0 0 0;font-size:13px;line-height:1.6;color:#6b7280;">If you did not request this email, you can safely ignore it.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px 24px 32px;border-top:1px solid #e6e8ee;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
            <p style="margin:0;font-size:12px;line-height:1.6;color:#8b90a0;">GAINS. A product of <a href="https://edvancelearning.us/" style="color:#4f46e5;text-decoration:none;">Edvance Learning</a>.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
