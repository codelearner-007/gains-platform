name: Deploy Supabase migrations (production)

# Applies any NEW migrations in supabase/migrations/ to the production database.
# `supabase db push` compares supabase/migrations against the remote migration
# history (supabase_migrations.schema_migrations) and runs ONLY the migrations
# that haven't been applied yet — never re-running old ones.
#
# Triggers on a push to main. A merged PR lands on main as a push, so this
# covers both "direct push to main" and "PR merged into main". It intentionally
# does NOT run on `pull_request` events — that would push an unmerged PR's
# migrations to production.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Never let two migration runs overlap (serialize on main).
concurrency:
  group: supabase-migrations-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: supabase db push
    runs-on: ubuntu-latest
    # Scopes this job to the "production" GitHub Environment. You can store the
    # secrets here (Environment secrets) and add required-reviewer protection so
    # prod migrations need an approval — or store them as repo secrets and leave
    # this as-is. Either works.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show pending migrations (dry run)
        run: supabase db push --dry-run

      - name: Apply new migrations
        run: supabase db push
