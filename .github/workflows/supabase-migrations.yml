name: Deploy Supabase migrations (production)

# Applies any NEW migrations in supabase/migrations/ to the production database.
# `supabase db push` compares supabase/migrations against the remote migration
# history (supabase_migrations.schema_migrations) and runs ONLY the migrations
# that haven't been applied yet — never re-running old ones.
#
# Trigger: push to main ONLY. A merged PR lands on main as a push, so this
# covers both "direct push to main" and "PR merged into main". There is
# deliberately NO `workflow_dispatch` and NO `pull_request` trigger: manual
# dispatch with production credentials is an unenforced gate (any branch could
# be dispatched), and pull_request would push unmerged migrations to prod.
# To re-run after a failure, use "Re-run jobs" on the existing run (same commit).
#
# ┌─ REQUIRED, enforce before relying on this workflow ────────────────────────┐
# │ This job runs against PRODUCTION with the prod DB password. The only        │
# │ in-platform controls that make that safe are on the `production`            │
# │ GitHub Environment (repo Settings → Environments → production):             │
# │   1. Deployment branches and tags → "Selected branches" → allow `main` ONLY.│
# │   2. Required reviewers → add at least one (manual approval per run).        │
# │   3. Store SUPABASE_* as ENVIRONMENT secrets HERE (not repo secrets), so the│
# │      reviewer/branch gate actually applies to the job that reads them.       │
# └─────────────────────────────────────────────────────────────────────────────┘

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"

# Never let two migration runs overlap (serialize on main).
concurrency:
  group: supabase-migrations-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: supabase db push
    runs-on: ubuntu-latest
    environment: production # gate: required reviewers + main-only branch policy (see header)
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      # Pinned to commit SHAs (not floating tags) — this job holds prod creds.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.106.0

      - name: Link to production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show pending migrations (dry run)
        run: supabase db push --dry-run

      - name: Apply new migrations
        run: supabase db push
