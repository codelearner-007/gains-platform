name: CI

# Fast, free checks on every PR (and every non-main branch push): type-checking,
# unit tests, and linting for both frontend and backend. Nothing here touches a
# real database or any secret — the backend job uses throwaway env values purely
# so settings load; the DB-free unit tests never open a connection. The full
# backend DB-integration suite runs locally (it is destructive to a shared dev
# DB, so it is deliberately NOT in CI). Migrations reach prod via the separate
# supabase-migrations.yml on merge to main.

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — typecheck, test, lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Lint
        # Informational: the repo carries pre-existing lint debt unrelated to any
        # single PR, so lint reports but does not block. Type-check + tests gate.
        run: npm run lint
        continue-on-error: true

  backend:
    name: Backend — lint, import, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Throwaway values so pydantic-settings loads at import. NOT secrets and
      # NOT real endpoints — the CI unit tests are DB-free and never connect.
      SUPABASE_URL: https://ci.invalid.supabase.co
      SUPABASE_ANON_KEY: ci-dummy-anon-key
      SUPABASE_SERVICE_KEY: ci-dummy-service-key
      JWT_SECRET: ci-dummy-jwt-secret-not-used
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app/
      - name: Import check
        run: python -c "from app.main import app; print('app import OK')"
      - name: Unit tests (DB-free)
        # Curated pure-unit tests that construct objects / call functions without a
        # DB. The full DB-integration suite is the LOCAL gate only (it is
        # destructive to a shared dev DB). test_lti_currentuser_email.py is on main
        # so it runs on every branch; the dashboard-only test lands with its
        # feature branch, so tolerate its absence on branches that predate it.
        run: |
          files="tests/services/test_lti_currentuser_email.py"
          [ -f tests/services/test_lti_dashboard_only.py ] && files="$files tests/services/test_lti_dashboard_only.py"
          # These two are DB-free by construction and pin structural guarantees that
          # were otherwise enforced by nothing: the production transform refusal, and
          # the frozen storage-key contract with the scraper.
          [ -f tests/jobs/test_prod_transform_guard.py ] && files="$files tests/jobs/test_prod_transform_guard.py"
          [ -f tests/jobs/test_storage_key_contract.py ] && files="$files tests/jobs/test_storage_key_contract.py"
          pytest -q $files

  scraper:
    name: scraper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        working-directory: scraper
        run: npm ci --omit=dev
      - name: Unit tests
        # Pure unit tests: no network, no browser, no DB (~200ms). They pin the
        # pagination invariants, the storage-key contract on the producing side, and
        # the "notifications never change the run outcome" rule. `pretest` fails if
        # the test files ever disappear, so the suite cannot pass vacuously.
        working-directory: scraper
        run: npm test
