[project]
dependencies = [
    "python-dateutil",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --import-mode=importlib --cov=app --cov-report=html"
filterwarnings = [
    "ignore::pydantic.PydanticDeprecatedSince20",
    # The pytest warning-filter format is `action:message_regex:category`.
    # The earlier value placed `asyncio_mode` in the `category` slot, which
    # pytest 8 then resolves as a Python class — failing to load with
    # "module 'builtins' has no attribute 'asyncio_mode'". Match the literal
    # message and leave the category default.
    "ignore:Unknown config option. asyncio_mode",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
